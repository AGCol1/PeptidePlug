<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Peptide Plug | Coming Soon</title>
    <link rel="icon" href="assets/images/pepbanner.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #090909;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(0, 140, 255, .18), transparent 45%),
                radial-gradient(circle at bottom, rgba(0, 140, 255, .1), transparent 50%);
        }

        .wrap {
            position: relative;
            z-index: 1;
            text-align: center;
            width: min(900px, 100%);
        }

        img {
            width: min(540px, 90%);
            max-width: 100%;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid #2f8cff;
            border-radius: 999px;
            color: #67b6ff;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(36px, 8vw, 72px);
            margin-bottom: 15px;
            line-height: 1.1;
        }

        p {
            color: #bfbfbf;
            font-size: clamp(15px, 3vw, 18px);
            line-height: 1.6;
            padding: 0 15px;
        }

        .count {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 45px 0;
        }

        .box {
            background: #141414;
            border: 1px solid #252525;
            border-radius: 18px;
            padding: 20px;
            width: 140px;
        }

        .num {
            display: block;
            font-size: clamp(36px, 8vw, 54px);
            font-weight: bold;
            color: #39a1ff;
        }

        .lbl {
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            font-size: 12px;
        }

        #live {
            margin-top: 20px;
            color: #67b6ff;
            font-size: 18px;
        }


        /* Mobile layout */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            img {
                width: 85%;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 38px;
            }

            p {
                font-size: 15px;
            }

            .count {
                gap: 10px;
                margin: 35px 0;
            }

            .box {
                width: calc(50% - 10px);
                padding: 18px 10px;
                border-radius: 15px;
            }

            .num {
                font-size: 42px;
            }

            .lbl {
                font-size: 11px;
                letter-spacing: 1px;
            }

            #live {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <img src="assets/images/pepbanner.png" alt="Logo">
        <h1>We're Almost Ready</h1>
        <p>Friday 3:00 PM UK. </p>
        <div class="count">
            <div class="box"><span class="num" id="d">00</span><span class="lbl">Days</span></div>
            <div class="box"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
            <div class="box"><span class="num" id="m">00</span><span class="lbl">Minutes</span></div>
            <div class="box"><span class="num" id="s">00</span><span class="lbl">Seconds</span></div>
        </div>
        <div id="live"></div>
    </div>
    <script>
        const target = new Date("2026-07-10T15:00:00+01:00");
        const ids = { d: d, h: h, m: m, s: s };
        function tick() {
            const diff = target - new Date();
            if (diff <= 0) { for (let k in ids) ids[k].textContent = "00"; live.textContent = "🎉 We're now live! Check back soon for the release of Peptide Plug!"; clearInterval(t); return; }
            ids.d.textContent = String(Math.floor(diff / 86400000)).padStart(2, "0");
            ids.h.textContent = String(Math.floor(diff / 3600000) % 24).padStart(2, "0");
            ids.m.textContent = String(Math.floor(diff / 60000) % 60).padStart(2, "0");
            ids.s.textContent = String(Math.floor(diff / 1000) % 60).padStart(2, "0");
        }
        tick(); const t = setInterval(tick, 1000);
    </script>
</body>

</html>
